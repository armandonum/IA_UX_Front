<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Heatmap Animado</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            margin-top: 0;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            padding: 15px;
            margin-bottom: 20px;
            background: #1f2937;
            border-radius: 10px;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 13px;
            color: #d1d5db;
        }

        input[type="file"] {
            max-width: 250px;
        }

        input[type="range"] {
            width: 160px;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .viewer {
            position: relative;
            width: 100%;
            background: black;
            border-radius: 10px;
            overflow: hidden;
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 75vh;
            object-fit: contain;
        }

        #heatmap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .info {
            margin-top: 15px;
            color: #9ca3af;
            font-size: 14px;
        }

        .value {
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔥 Heatmap animado sobre video</h1>

    <div class="controls">

        <div class="control">
            <label>Video MP4 / WebM</label>
            <input
                id="videoFile"
                type="file"
                accept="video/mp4,video/webm"
            >
        </div>

        <div class="control">
            <label>
                Puntos calientes:
                <span id="pointsValue" class="value">8</span>
            </label>

            <input
                id="points"
                type="range"
                min="1"
                max="30"
                value="8"
            >
        </div>

        <div class="control">
            <label>
                Radio:
                <span id="radiusValue" class="value">90</span>
            </label>

            <input
                id="radius"
                type="range"
                min="30"
                max="200"
                value="90"
            >
        </div>

        <div class="control">
            <label>
                Intensidad:
                <span id="intensityValue" class="value">0.75</span>
            </label>

            <input
                id="intensity"
                type="range"
                min="0.1"
                max="1"
                step="0.05"
                value="0.75"
            >
        </div>

        <div class="control">
            <label>
                Velocidad:
                <span id="speedValue" class="value">1</span>
            </label>

            <input
                id="speed"
                type="range"
                min="0.1"
                max="3"
                step="0.1"
                value="1"
            >
        </div>

        <button id="reset">
            Reiniciar puntos
        </button>

    </div>

    <div class="viewer">

        <video
            id="video"
            controls
            playsinline
        ></video>

        <canvas id="heatmap"></canvas>

    </div>

    <div class="info">
        Selecciona un video para comenzar.
        El mapa de calor se genera y anima directamente sobre el video.
    </div>

</div>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("heatmap");
const ctx = canvas.getContext("2d");

const fileInput = document.getElementById("videoFile");

const pointsSlider = document.getElementById("points");
const radiusSlider = document.getElementById("radius");
const intensitySlider = document.getElementById("intensity");
const speedSlider = document.getElementById("speed");

const pointsValue = document.getElementById("pointsValue");
const radiusValue = document.getElementById("radiusValue");
const intensityValue = document.getElementById("intensityValue");
const speedValue = document.getElementById("speedValue");

const resetButton = document.getElementById("reset");

let heatPoints = [];

let animationId = null;

let lastTime = performance.now();


// ---------------------------------------------------------
// CARGAR VIDEO
// ---------------------------------------------------------

fileInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
        return;
    }

    const url = URL.createObjectURL(file);

    video.src = url;

    video.load();

    video.addEventListener(
        "loadedmetadata",
        () => {

            resizeCanvas();

            generatePoints();

        },
        {
            once: true
        }
    );

});


// ---------------------------------------------------------
// AJUSTAR CANVAS
// ---------------------------------------------------------

function resizeCanvas() {

    const rect = video.getBoundingClientRect();

    canvas.width = video.videoWidth || rect.width;
    canvas.height = video.videoHeight || rect.height;

}


// ---------------------------------------------------------
// CREAR PUNTOS
// ---------------------------------------------------------

function generatePoints() {

    heatPoints = [];

    const count = Number(pointsSlider.value);

    for (let i = 0; i < count; i++) {

        heatPoints.push({

            // posición normalizada
            x: 0.15 + Math.random() * 0.70,
            y: 0.15 + Math.random() * 0.70,

            // posición objetivo
            targetX: 0.15 + Math.random() * 0.70,
            targetY: 0.15 + Math.random() * 0.70,

            // velocidad de movimiento
            speed: 0.15 + Math.random() * 0.45,

            // fase individual
            phase: Math.random() * Math.PI * 2,

            // intensidad individual
            intensity:
                0.6 +
                Math.random() * 0.4,

            // tiempo hasta cambiar objetivo
            changeTime:
                1 +
                Math.random() * 4

        });

    }

}


// ---------------------------------------------------------
// CAMBIAR OBJETIVOS
// ---------------------------------------------------------

function updatePoint(point, delta) {

    point.changeTime -= delta;

    if (point.changeTime <= 0) {

        point.targetX =
            0.10 +
            Math.random() * 0.80;

        point.targetY =
            0.10 +
            Math.random() * 0.80;

        point.changeTime =
            1.5 +
            Math.random() * 4;

    }


    const dx = point.targetX - point.x;
    const dy = point.targetY - point.y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance > 0.001) {

        const movement =
            point.speed *
            delta *
            Number(speedSlider.value);

        point.x +=
            (dx / distance) *
            movement;

        point.y +=
            (dy / distance) *
            movement;

    }

}


// ---------------------------------------------------------
// GRADIENTE DEL MAPA DE CALOR
// ---------------------------------------------------------

function drawHeatPoint(
    x,
    y,
    radius,
    intensity
) {

    const gradient =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            radius
        );


    /*
        El gradiente tiene varias zonas:

        centro:
        rojo / amarillo

        medio:
        naranja

        exterior:
        transparente
    */

    gradient.addColorStop(
        0,
        `rgba(255, 0, 0, ${intensity})`
    );

    gradient.addColorStop(
        0.20,
        `rgba(255, 40, 0, ${intensity * 0.9})`
    );

    gradient.addColorStop(
        0.40,
        `rgba(255, 150, 0, ${intensity * 0.75})`
    );

    gradient.addColorStop(
        0.60,
        `rgba(255, 230, 0, ${intensity * 0.55})`
    );

    gradient.addColorStop(
        0.80,
        `rgba(0, 255, 100, ${intensity * 0.25})`
    );

    gradient.addColorStop(
        1,
        `rgba(0, 255, 0, 0)`
    );


    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


// ---------------------------------------------------------
// ANIMACIÓN
// ---------------------------------------------------------

function animate(now) {

    animationId =
        requestAnimationFrame(animate);


    const delta =
        Math.min(
            (now - lastTime) / 1000,
            0.05
        );

    lastTime = now;


    if (!video.videoWidth) {
        return;
    }


    // limpiar canvas

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const radius =
        Number(radiusSlider.value);

    const intensity =
        Number(intensitySlider.value);


    // actualizar puntos

    heatPoints.forEach(point => {

        updatePoint(
            point,
            delta
        );

        /*
         * Pulsación suave.
         * Hace que el mapa parezca vivo.
         */

        point.phase +=
            delta *
            Number(speedSlider.value);

        const pulse =
            0.85 +
            Math.sin(point.phase * 2) *
            0.15;


        const x =
            point.x *
            canvas.width;

        const y =
            point.y *
            canvas.height;


        drawHeatPoint(
            x,
            y,
            radius,
            intensity *
            point.intensity *
            pulse
        );

    });

}


// ---------------------------------------------------------
// EVENTOS
// ---------------------------------------------------------

pointsSlider.addEventListener(
    "input",
    () => {

        pointsValue.textContent =
            pointsSlider.value;

        generatePoints();

    }
);


radiusSlider.addEventListener(
    "input",
    () => {

        radiusValue.textContent =
            radiusSlider.value;

    }
);


intensitySlider.addEventListener(
    "input",
    () => {

        intensityValue.textContent =
            intensitySlider.value;

    }
);


speedSlider.addEventListener(
    "input",
    () => {

        speedValue.textContent =
            speedSlider.value;

    }
);


resetButton.addEventListener(
    "click",
    () => {

        generatePoints();

    }
);


// ---------------------------------------------------------
// VIDEO
// ---------------------------------------------------------

video.addEventListener(
    "play",
    () => {

        lastTime =
            performance.now();

        if (!animationId) {

            animationId =
                requestAnimationFrame(
                    animate
                );

        }

    }
);


video.addEventListener(
    "pause",
    () => {

        /*
         * No detenemos completamente
         * el canvas para que el último
         * estado quede visible.
         */

    }
);


video.addEventListener(
    "loadedmetadata",
    resizeCanvas
);


window.addEventListener(
    "resize",
    resizeCanvas
);


// iniciar animación

animationId =
    requestAnimationFrame(
        animate
);

</script>

</body>
</html>
