<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visor de Heatmap</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      color: #64748b;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 300px;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      resize: vertical;
      background: white;
    }

    button {
      margin-top: 15px;
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      background: #1e3a8a;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #172554;
    }

    .error {
      margin-top: 15px;
      padding: 12px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      display: none;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .result img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 20px auto 0;
      border: 1px solid #e2e8f0;
    }

    .info {
      color: #64748b;
      font-size: 14px;
    }

    .download {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 18px;
      background: #0f766e;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔥 Visor de Heatmap</h1>

  <p class="description">
    Pega aquí el contenido del array <strong>data</strong> que devuelve tu API.
  </p>

  <textarea id="imageData" placeholder="Pega aquí:

137,
80,
78,
71,
13,
10,
26,
10,
...

"></textarea>

  <br>

  <button onclick="mostrarImagen()">
    Mostrar imagen
  </button>

  <div id="error" class="error"></div>

  <div id="resultado" class="result" style="display: none;">

    <div class="info">
      Imagen PNG generada correctamente.
    </div>

    <img id="heatmapImage" alt="Heatmap generado">

    <br>

    <a
      id="downloadLink"
      class="download"
      download="heatmap.png"
    >
      Descargar PNG
    </a>

  </div>

</div>


<script>

function mostrarImagen() {

  const textarea = document.getElementById("imageData");
  const error = document.getElementById("error");
  const resultado = document.getElementById("resultado");
  const imagen = document.getElementById("heatmapImage");
  const downloadLink = document.getElementById("downloadLink");

  error.style.display = "none";
  resultado.style.display = "none";

  try {

    let texto = textarea.value.trim();

    if (!texto) {
      throw new Error("Debes pegar el array de bytes.");
    }

    /*
     * Permitimos que pegues:
     *
     * 137, 80, 78, 71
     *
     * o incluso:
     *
     * [
     *   137,
     *   80,
     *   78,
     *   71
     * ]
     */

    texto = texto
      .replace(/^\s*\[/, "")
      .replace(/\]\s*$/, "");

    const numeros = texto
      .split(",")
      .map(numero => numero.trim())
      .filter(numero => numero !== "")
      .map(numero => Number(numero));

    if (numeros.length === 0) {
      throw new Error("No se encontraron números.");
    }

    /*
     * Validamos que sean bytes válidos
     */

    for (const numero of numeros) {

      if (
        !Number.isInteger(numero) ||
        numero < 0 ||
        numero > 255
      ) {
        throw new Error(
          "El array contiene un valor inválido: " + numero
        );
      }

    }

    /*
     * Convertimos los números a bytes
     */

    const bytes = new Uint8Array(numeros);

    /*
     * Creamos el archivo PNG
     */

    const blob = new Blob(
      [bytes],
      {
        type: "image/png"
      }
    );

    /*
     * Creamos una URL temporal
     */

    const url = URL.createObjectURL(blob);

    /*
     * Mostramos la imagen
     */

    imagen.src = url;

    /*
     * Configuramos descarga
     */

    downloadLink.href = url;

    resultado.style.display = "block";

  } catch (e) {

    error.textContent =
      "❌ Error: " + e.message;

    error.style.display = "block";

  }

}

</script>

</body>
</html>
